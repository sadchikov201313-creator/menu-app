name: Build APK 2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          bash project.sh
          for f in $(ls update*.sh 2>/dev/null | sort -V); do bash "$f"; done
          cd FakeMenu
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/FakeMenu.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FakeMenu-APK-2
          path: out/FakeMenu.apk
